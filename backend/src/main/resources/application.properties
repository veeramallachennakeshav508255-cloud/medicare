# CareConnect AI Spring Boot Backend Configuration
server.port=8080

# Spring Application
spring.application.name=careconnect-backend

# In-Memory H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:careconnectdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Secret & Expiration (24 hours)
careconnect.jwt.secret=${JWT_SECRET}
careconnect.jwt.expiration-ms=86400000

# CORS Configuration
careconnect.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
